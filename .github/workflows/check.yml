# The gate of this repository: `make check` on ubuntu-latest.
#
# It runs the action's own script against test/stub.py -- a loopback registry --
# so nothing here reaches the network and the job needs no secret and no
# permission beyond the default read.
name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tool facts
        run: |
          sh --version 2>&1 | head -1 || true
          curl --version | head -1
          python3 --version
          shellcheck --version | sed -n '2,3p'
      - name: make check
        run: make check
